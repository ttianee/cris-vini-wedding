
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5dfd1">
  <title>Obrigada — Cris &amp; Vini</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f5dfd1;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .thank-you-image {
      display: block;
      width: 100%;
      max-width: 1100px;
      height: auto;
      max-height: calc(100dvh - 24px);
      object-fit: contain;
      object-position: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .thank-you-image {
        width: 100%;
        max-height: calc(100dvh - 16px);
      }
    }
  </style>
</head>

<body>
  <img
    class="thank-you-image"
    src="./assets/photos/agradecimento-pt.png"
    alt="Agradecimento de Cris e Vini"
  >
</body>
</html>
