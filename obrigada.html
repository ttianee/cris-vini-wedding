
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obrigada — Cris & Vini</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f5dfd1;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100dvh - 24px);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img
    src="../assets/photos/agradecimento-pt.png"
    alt="Agradecimento de Cris e Vini"
  >
